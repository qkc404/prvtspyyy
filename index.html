<script>
(function() {
    const PASS = 'saeka';
    let currentHost = window.location.hostname || '127.0.0.1';
    
    const PROTOCOLS = ['vless', 'trojan', 'vmess', 'shadowsocks'];
    const PROTOCOL_LABELS = { vless: 'VLESS', trojan: 'Trojan', vmess: 'VMess', shadowsocks: 'Shadowsocks' };
    
    // Cloud Run Native Transports
    const TRANSPORTS = ['ws', 'hu', 'xh'];
    const TRANSPORT_LABELS = { ws: 'WebSocket', hu: 'HTTP Upgrade', xh: 'XHTTP (Multiplexed)' };

    const PATHS = { vless: '/vless-saeka', trojan: '/saeka-tojirp', vmess: '/vmess-saeka', shadowsocks: '/ss-saeka' };

    let selectedProtocol = 'vless';
    let selectedTransport = 'xh';
    let selectedAddress = currentHost;
    let selectedSNI = currentHost;

    let addressList = [currentHost];
    let sniList = [currentHost];

    let speedHistory = [];
    let lastUpdateTime = Date.now();

    const infoHost = document.getElementById('info-host');
    const runtimeDisplay = document.getElementById('runtime-display');
    const addressDropdownBtn = document.getElementById('address-dropdown-btn');
    const addressDropdown = document.getElementById('address-dropdown');
    const addressSelected = document.getElementById('address-selected');
    const sniDropdownBtn = document.getElementById('sni-dropdown-btn');
    const sniDropdown = document.getElementById('sni-dropdown');
    const sniSelected = document.getElementById('sni-selected');
    const protocolBar = document.getElementById('protocol-bar');
    const transportBar = document.getElementById('transport-bar');
    const pingDisplay = document.getElementById('ping-display');
    const configDisplay = document.getElementById('config-display');
    const copyBtn = document.getElementById('copy-btn');
    const speedDownload = document.getElementById('speed-download');
    const speedUpload = document.getElementById('speed-upload');
    const speedLatency = document.getElementById('speed-latency');
    const speedDownloadUnit = document.getElementById('speed-download-unit');
    const speedUploadUnit = document.getElementById('speed-upload-unit');
    const graphContainer = document.getElementById('graph-container');
    const logContainer = document.getElementById('log-container');
    const loadingScreen = document.getElementById('loading-screen');
    const mainContent = document.getElementById('main-content');

    function addLog(message) {
        const now = new Date();
        const time = now.toTimeString().split(' ');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = '<span class="time">' + time + '</span> ' + message;
        logContainer.appendChild(entry);
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    function initPortal() {
        infoHost.textContent = currentHost;
        setupDropdown(addressDropdown, addressList, (val) => {
            selectedAddress = val;
            addressSelected.textContent = 'HOST: ' + val;
            addressDropdownBtn.textContent = val + ' ▾';
            updateConfigDisplay();
            pingCombined();
        });
        setupDropdown(sniDropdown, sniList, (val) => {
            selectedSNI = val;
            sniSelected.textContent = 'SNI: ' + val;
            sniDropdownBtn.textContent = val + ' ▾';
            updateConfigDisplay();
            pingCombined();
        });

        addressDropdownBtn.textContent = selectedAddress + ' ▾';
        sniDropdownBtn.textContent = selectedSNI + ' ▾';

        addressDropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); addressDropdown.classList.toggle('show'); sniDropdown.classList.remove('show'); });
        sniDropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); sniDropdown.classList.toggle('show'); addressDropdown.classList.remove('show'); });
        document.addEventListener('click', () => { addressDropdown.classList.remove('show'); sniDropdown.classList.remove('show'); });

        setInterval(simulateSpeedStream, 500);
        setInterval(updateRuntime, 1000);
    }

    function setupDropdown(element, items, callback) {
        element.innerHTML = '';
        items.forEach(item => {
            const dItem = document.createElement('div');
            dItem.className = 'dropdown-item';
            dItem.textContent = item;
            dItem.addEventListener('click', () => {
                element.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('selected'));
                dItem.classList.add('selected');
                callback(item);
            });
            element.appendChild(dItem);
        });
    }

    function simulateSpeedStream() {
        const now = Date.now();
        const timeDiff = (now - lastUpdateTime) / 1000;
        if (timeDiff >= 0.5) {
            const rawDl = Math.random() * 25000 + 8000;
            const rawUl = Math.random() * 12000 + 4000;
            speedDownload.textContent = (rawDl / 1024).toFixed(1);
            speedDownloadUnit.textContent = 'MB/s';
            speedUpload.textContent = (rawUl / 1024).toFixed(1);
            speedUploadUnit.textContent = 'MB/s';
            speedLatency.textContent = Math.floor(Math.random() * 14 + 4);
            speedHistory.push(rawDl);
            if (speedHistory.length > 40) speedHistory.shift();
            updateGraph();
            lastUpdateTime = now;
        }
    }

    function updateGraph() {
        graphContainer.innerHTML = '';
        const max = Math.max(...speedHistory, 1000);
        speedHistory.forEach(s => {
            const bar = document.createElement('div');
            bar.className = 'graph-bar';
            bar.style.height = ((s / max) * 100) + '%';
            graphContainer.appendChild(bar);
        });
    }

    function updateRuntime() {
        const diff = Math.floor(performance.now() / 1000);
        const hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
        const mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        const secs = String(diff % 60).padStart(2, '0');
        runtimeDisplay.textContent = hrs + ':' + mins + ':' + secs;
    }

    function pingCombined() {
        pingDisplay.innerHTML = '<span class="status-dot green"></span> ALIVE: ' + selectedAddress + ' [RTT: ' + Math.floor(Math.random() * 12 + 5) + 'ms]';
    }

    function getPath() {
        let path = PATHS[selectedProtocol];
        if (selectedTransport === 'hu') path += '-hu';
        else if (selectedTransport === 'xh') path += '-xh';
        return path;
    }

    function buildConfig() {
        const addr = selectedAddress;
        const sni = selectedSNI;
        const host = currentHost;
        const path = getPath();
        
        const netType = (selectedTransport === 'xh') ? 'xhttp' : (selectedTransport === 'hu' ? 'httpupgrade' : 'ws');
        const transportParam = (selectedTransport === 'ws') ? 'type=ws&path=' : 'type=http&path=';
        switch (selectedProtocol) {
            case 'vless': return 'vless://' + PASS + '@' + addr + ':443?encryption=none&flow=none&' + transportParam + encodeURIComponent(path) + '&host=' + host + '&security=tls&fp=chrome&sni=' + sni + '&alpn=h2,http%2F1.1#VLESS-' + selectedTransport.toUpperCase() + '-' + host;
            case 'trojan': return 'trojan://' + PASS + '@' + addr + ':443?' + transportParam + encodeURIComponent(path) + '&host=' + host + '&security=tls&fp=chrome&sni=' + sni + '&alpn=h2,http%2F1.1#TROJAN-' + selectedTransport.toUpperCase() + '-' + host;
            case 'vmess': return 'vmess://' + btoa(JSON.stringify({ v: '2', ps: 'VMESS-' + selectedTransport.toUpperCase() + '-' + host, add: addr, port: '443', id: PASS, aid: '0', scy: 'auto', net: netType, type: 'none', host: host, path: path, tls: 'tls', sni: sni, fp: 'chrome', alpn: 'h2,http/1.1' }));
            case 'shadowsocks': return 'ss://' + btoa('aes-256-gcm:' + PASS) + '@' + addr + ':443#' + transportParam + encodeURIComponent(path) + '&host=' + host + '&security=tls&sni=' + sni + '#SS-' + selectedTransport.toUpperCase() + '-' + host;
        }
    }

    function updateConfigDisplay() {
        configDisplay.textContent = buildConfig();
    }

    function buildButtonBar(container, items, selected, labels, callback) {
        container.innerHTML = '';
        items.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            if (item === selected) btn.classList.add('active');
            btn.textContent = labels ? labels[item] : item;
            btn.addEventListener('click', () => {
                container.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                callback(item);
                updateConfigDisplay();
            });
            container.appendChild(btn);
        });
    }

    buildButtonBar(protocolBar, PROTOCOLS, selectedProtocol, PROTOCOL_LABELS, (val) => { selectedProtocol = val; addLog('Protocol switched to ' + val.toUpperCase()); });
    buildButtonBar(transportBar, TRANSPORTS, selectedTransport, TRANSPORT_LABELS, (val) => { selectedTransport = val; addLog('Transport changed to ' + val.toUpperCase()); });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(configDisplay.textContent).then(() => {
            copyBtn.textContent = 'COPIED!';
            setTimeout(() => { copyBtn.textContent = 'COPY'; }, 1500);
        });
    });

    setTimeout(() => {
        loadingScreen.classList.add('hidden');
        mainContent.style.display = 'block';
        initPortal();
        updateConfigDisplay();
    }, 1500);
})();
</script>
